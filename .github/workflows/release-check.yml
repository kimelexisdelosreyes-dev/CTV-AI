name: Release Check

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Backend tests
        run: python -m pytest tests -q
      - name: Compile backend
        run: python -m compileall -q app tests ../scripts
      - name: Verify one Alembic head
        run: test "$(python -m alembic -c alembic.ini heads | wc -l)" -eq 1
      - name: Generate offline migration SQL
        run: python -m alembic -c alembic.ini upgrade head --sql > /dev/null
      - name: Check whitespace
        working-directory: .
        run: git diff --check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/enterprise-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/enterprise-ui/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Typecheck frontend
        run: npm exec tsc -- --noEmit
      - name: Build frontend
        run: npm run build
