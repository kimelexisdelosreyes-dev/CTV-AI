services:
  postgres:
    image: postgres:17-alpine
    container_name: ctv-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ctvai
      POSTGRES_USER: ctvai
      POSTGRES_PASSWORD: ctvai_change_me
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ctv-ai-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ctvai -d ctvai"]
      interval: 10s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: ctv-ai-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - ctv-ai-qdrant-data:/qdrant/storage

  ctv-ai-core:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: ctv-ai-core
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    ports:
      - "8000:8000"
    environment:
      APP_NAME: CTV-AI Core
      APP_VERSION: 1.1.0
      API_V1_PREFIX: /api/v1
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: qwen3:14b
      CTV_AI_API_KEY: ctv-ai-local
      DATABASE_URL: postgresql+asyncpg://ctvai:ctvai_change_me@postgres:5432/ctvai
      QDRANT_URL: http://qdrant:6333
      JWT_SECRET_KEY: CHANGE_THIS_TO_A_LONG_RANDOM_SECRET
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 480
      LOG_LEVEL: INFO
      REQUEST_TIMEOUT_SECONDS: 180
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  ctv-ai-postgres-data:
  ctv-ai-qdrant-data:
